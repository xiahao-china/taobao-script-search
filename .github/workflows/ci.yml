name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Windows, Node 24)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install test browser
        run: npx playwright install chromium --no-shell

      - name: Parse every source file
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -File -Include *.js -Path src, bin, scripts, tests, packaging
          foreach ($file in $files) { node --check $file.FullName; if ($LASTEXITCODE -ne 0) { exit 1 } }
          "parsed $($files.Count) files"

      - name: Run tests
        run: npm test
        env:
          CI: 'true'

  audit:
    name: Publication audit
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check the tracked snapshot
        run: git add -A && npm run audit:publish

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan history and snapshot with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
